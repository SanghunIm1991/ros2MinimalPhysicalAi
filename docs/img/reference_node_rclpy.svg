<text x="475.0" y="568" text-anchor="middle" font-weight="bold" font-size="13">ActionServer / ActionClient</text>
<line x1="350" y1="575" x2="600" y2="575" stroke="#3b6fb6" stroke-width="1"/>
<text x="358" y="591" font-size="12">rclpy.action（Waitable の一種）</text>
<rect x="640" y="548" width="210" height="54" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="745.0" y="568" text-anchor="middle" font-weight="bold" font-size="13">ParameterService</text>
<line x1="640" y1="575" x2="850" y2="575" stroke="#777777" stroke-width="1"/>
<text x="648" y="591" font-size="12">ros2 param の要求に答える</text>
<rect x="880" y="548" width="210" height="54" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="985.0" y="568" text-anchor="middle" font-weight="bold" font-size="13">ROSClock</text>
<line x1="880" y1="575" x2="1090" y2="575" stroke="#777777" stroke-width="1"/>
<text x="888" y="591" font-size="12">get_clock() が返す時計</text>
<rect x="20" y="548" width="230" height="54" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="135.0" y="568" text-anchor="middle" font-weight="bold" font-size="13">CallbackGroup</text>
<line x1="20" y1="575" x2="250" y2="575" stroke="#777777" stroke-width="1"/>
<text x="28" y="591" font-size="12">既定は MutuallyExclusive</text>
<text x="300" y="158" text-anchor="middle" font-size="11" fill="#444444">所属</text>
<text x="300" y="248" text-anchor="middle" font-size="11" fill="#444444">中身</text>
<text x="300" y="353" text-anchor="middle" font-size="11" fill="#444444">登録</text>
<text x="300" y="379" text-anchor="middle" font-size="11" fill="#444444">して回す</text>
<text x="830" y="196" text-anchor="middle" font-size="11" fill="#444444">作ってlist</text>
<text x="830" y="213" text-anchor="middle" font-size="11" fill="#444444">で保持</text>
<text x="482" y="518" text-anchor="start" font-size="11" fill="#444444">add_waitable で登録</text>
<text x="78" y="624" text-anchor="start" font-size="11" fill="#444444">継承（矢印の先が親クラス）</text>
<text x="358" y="624" text-anchor="start" font-size="11" fill="#444444">保持（ひし形の側が持ち主）</text>
<text x="638" y="624" text-anchor="start" font-size="11" fill="#444444">使う・登録する・作って返す</text>
</svg>
