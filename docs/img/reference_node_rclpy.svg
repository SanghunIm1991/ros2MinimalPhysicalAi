<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 640" width="1110" height="640" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="12" role="img" aria-label="図: Python版（rclpy）のNodeクラスと周辺のクラス。自作ノードがNodeを継承し、NodeはContextに属し、C拡張の_rclpy.Nodeを内部に持つ。NodeはPublisher・Subscription・Timer・Service・Clientを作って自分のリストで保持する。ExecutorはNodeを登録してコールバックを呼ぶ。ActionServer・ActionClientはadd_waitableでNodeに登録される">
<title>図: Python版（rclpy）のNodeクラスと周辺のクラス。自作ノードがNodeを継承し、NodeはContextに属し、C拡張の_rclpy.Nodeを内部に持つ。NodeはPublisher・Subscription・Timer・Service・Clientを作って自分のリストで保持する。ExecutorはNodeを登録してコールバックを呼ぶ。ActionServer・ActionClientはadd_waitableでNodeに登録される</title>
<defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#333333" stroke-width="1.2"/></marker><marker id="dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#333333"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="1110" height="640" fill="#ffffff"/>
<path d="M565,88 L565,130" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#tri)"/>
<path d="M350,165 L250,165" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/>
