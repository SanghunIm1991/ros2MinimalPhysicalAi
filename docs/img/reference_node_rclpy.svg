<path d="M780,167.0 L880,167.0" fill="none" stroke="#333333" stroke-width="1.4" marker-start="url(#dia)" marker-end="url(#arr)"/>
<path d="M780,232.0 L880,232.0" fill="none" stroke="#333333" stroke-width="1.4" marker-start="url(#dia)" marker-end="url(#arr)"/>
<path d="M780,297.0 L880,297.0" fill="none" stroke="#333333" stroke-width="1.4" marker-start="url(#dia)" marker-end="url(#arr)"/>
<path d="M780,362.0 L880,362.0" fill="none" stroke="#333333" stroke-width="1.4" marker-start="url(#dia)" marker-end="url(#arr)"/>
<path d="M780,427.0 L880,427.0" fill="none" stroke="#333333" stroke-width="1.4" marker-start="url(#dia)" marker-end="url(#arr)"/>
