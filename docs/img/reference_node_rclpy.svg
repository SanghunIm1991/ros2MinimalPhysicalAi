<rect x="20" y="330" width="230" height="72" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="135.0" y="350" text-anchor="middle" font-weight="bold" font-size="13">Executor</text>
<line x1="20" y1="357" x2="250" y2="357" stroke="#3b6fb6" stroke-width="1"/>
<text x="28" y="373" font-size="12">+ add_node(node)</text>
<text x="28" y="391" font-size="12">+ spin() / spin_once()</text>
<rect x="20" y="450" width="230" height="54" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="135.0" y="470" text-anchor="middle" font-weight="bold" font-size="13">SingleThreadedExecutor</text>
<line x1="20" y1="477" x2="250" y2="477" stroke="#3b6fb6" stroke-width="1"/>
<text x="28" y="493" font-size="12">MultiThreadedExecutor（3-5）</text>
<rect x="880" y="140" width="210" height="54" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="985.0" y="160" text-anchor="middle" font-weight="bold" font-size="13">Publisher</text>
<line x1="880" y1="167" x2="1090" y2="167" stroke="#3b6fb6" stroke-width="1"/>
<text x="888" y="183" font-size="12">+ publish(msg)</text>
<rect x="880" y="205" width="210" height="54" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="985.0" y="225" text-anchor="middle" font-weight="bold" font-size="13">Subscription</text>
<line x1="880" y1="232" x2="1090" y2="232" stroke="#3b6fb6" stroke-width="1"/>
<text x="888" y="248" font-size="12">（コールバックを持つ）</text>
<rect x="880" y="270" width="210" height="54" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="985.0" y="290" text-anchor="middle" font-weight="bold" font-size="13">Timer</text>
<line x1="880" y1="297" x2="1090" y2="297" stroke="#3b6fb6" stroke-width="1"/>
<text x="888" y="313" font-size="12">+ cancel()</text>
<rect x="880" y="335" width="210" height="54" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="985.0" y="355" text-anchor="middle" font-weight="bold" font-size="13">Service</text>
<line x1="880" y1="362" x2="1090" y2="362" stroke="#3b6fb6" stroke-width="1"/>
<text x="888" y="378" font-size="12">（コールバックを持つ）</text>
<rect x="880" y="400" width="210" height="54" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
