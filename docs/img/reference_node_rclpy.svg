<path d="M770,478 L770,508 L985,508 L985,548" fill="none" stroke="#333333" stroke-width="1.4" marker-start="url(#dia)" marker-end="url(#arr)"/>
<path d="M365,478 L365,508 L135,508 L135,548" fill="none" stroke="#333333" stroke-width="1.4" marker-start="url(#dia)" marker-end="url(#arr)"/>
<path d="M20,620 L70,620" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#tri)"/>
<path d="M300,620 L350,620" fill="none" stroke="#333333" stroke-width="1.4" marker-start="url(#dia)" marker-end="url(#arr)"/>
<path d="M580,620 L630,620" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<rect x="400" y="16" width="330" height="72" rx="4" fill="#fff4dc" stroke="#b07d00" stroke-width="1.5"/>
<text x="565.0" y="36" text-anchor="middle" font-weight="bold" font-size="13">自作ノード（Talker・Listener など）</text>
<line x1="400" y1="43" x2="730" y2="43" stroke="#b07d00" stroke-width="1"/>
<text x="408" y="59" font-size="12">+ __init__()：通信の口を作る</text>
<text x="408" y="77" font-size="12">+ on_timer() などのコールバック</text>
<rect x="350" y="130" width="430" height="348" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="565.0" y="150" text-anchor="middle" font-weight="bold" font-size="13">rclpy.node.Node</text>
<line x1="350" y1="157" x2="780" y2="157" stroke="#3b6fb6" stroke-width="1"/>
<text x="358" y="173" font-size="12">- _context: Context</text>
<text x="358" y="191" font-size="12">- __node: _rclpy.Node（C拡張のノード本体）</text>
<text x="358" y="209" font-size="12">- _publishers / _subscriptions / _timers: list</text>
<text x="358" y="227" font-size="12">- _services / _clients: list</text>
<text x="358" y="245" font-size="12">- _parameters: dict</text>
<text x="358" y="263" font-size="12">- _default_callback_group: CallbackGroup</text>
<line x1="350" y1="271" x2="780" y2="271" stroke="#3b6fb6" stroke-width="1"/>
<text x="358" y="287" font-size="12">+ create_publisher(型, 名前, qos)</text>
<text x="358" y="305" font-size="12">+ create_subscription(型, 名前, コールバック, qos)</text>
<text x="358" y="323" font-size="12">+ create_timer(周期[秒], コールバック)</text>
<text x="358" y="341" font-size="12">+ create_service(型, 名前, コールバック)</text>
<text x="358" y="359" font-size="12">+ create_client(型, 名前)</text>
<text x="358" y="377" font-size="12">+ declare_parameter(名前, 既定値)</text>
<text x="358" y="395" font-size="12">+ get_parameter(名前)</text>
<text x="358" y="413" font-size="12">+ add_on_set_parameters_callback(コールバック)</text>
<text x="358" y="431" font-size="12">+ get_logger() / get_clock() / get_name()</text>
<text x="358" y="449" font-size="12">+ add_waitable(waitable)</text>
<text x="358" y="467" font-size="12">+ destroy_node()</text>
<rect x="20" y="140" width="230" height="54" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="135.0" y="160" text-anchor="middle" font-weight="bold" font-size="13">Context</text>
<line x1="20" y1="167" x2="250" y2="167" stroke="#777777" stroke-width="1"/>
<text x="28" y="183" font-size="12">rclpy.init() で作られる</text>
<rect x="20" y="230" width="230" height="54" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="135.0" y="250" text-anchor="middle" font-weight="bold" font-size="13">_rclpy.Node（C拡張）</text>
<line x1="20" y1="257" x2="250" y2="257" stroke="#777777" stroke-width="1"/>
