<text x="190" y="261" text-anchor="middle">best_effort</text>
<text x="590" y="261" text-anchor="middle">reliable</text>
<text x="34" y="326" font-weight="bold" fill="#444">durability（持続性）: 後から来た購読側に、過去のメッセージを渡すか</text>
<text x="58" y="365" text-anchor="middle" font-size="18">⑤</text>
<text x="190" y="365" text-anchor="middle">transient_local</text>
<text x="590" y="365" text-anchor="middle">transient_local</text>
<text x="58" y="415" text-anchor="middle" font-size="18">⑥</text>
<text x="190" y="415" text-anchor="middle">transient_local</text>
<text x="590" y="415" text-anchor="middle">volatile</text>
<text x="58" y="465" text-anchor="middle" font-size="18">⑦</text>
<text x="190" y="465" text-anchor="middle">volatile</text>
<text x="590" y="465" text-anchor="middle">transient_local</text>
<text x="390.0" y="99" text-anchor="middle" font-size="12" fill="#1a1a1a" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">つながる</text>
