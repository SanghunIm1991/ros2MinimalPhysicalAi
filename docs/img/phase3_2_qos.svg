<text x="190" y="30" text-anchor="middle" font-weight="bold">qos_talker（配信側・提供する）</text>
<text x="590" y="30" text-anchor="middle" font-weight="bold">qos_listener（購読側・要求する）</text>
<text x="34" y="72" font-weight="bold" fill="#444">reliability（信頼性）: 届かなかったメッセージを再送するか</text>
<text x="58" y="111" text-anchor="middle" font-size="18">①</text>
<text x="190" y="111" text-anchor="middle">reliable</text>
<text x="590" y="111" text-anchor="middle">reliable</text>
<text x="58" y="161" text-anchor="middle" font-size="18">②</text>
<text x="190" y="161" text-anchor="middle">reliable</text>
<text x="590" y="161" text-anchor="middle">best_effort</text>
