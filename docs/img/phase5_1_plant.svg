<rect x="350" y="70" width="180" height="78" rx="8" fill="#fff6e5" stroke="#c98a14" stroke-width="1.5"/>
<rect x="680" y="70" width="180" height="78" rx="8" fill="#fff6e5" stroke="#c98a14" stroke-width="1.5"/>
<rect x="680" y="245" width="180" height="78" rx="8" fill="#eaf6e8" stroke="#4a8f45" stroke-width="1.5"/>
<rect x="350" y="245" width="180" height="78" rx="8" fill="#eaf6e8" stroke="#4a8f45" stroke-width="1.5"/>
<text x="347" y="48" font-weight="bold">この手順書で作るノード（learn_py）</text>
<text x="347" y="223" font-weight="bold">5-0のデモ（diff_drive.launch.py）</text>
<text x="110.0" y="96.0" text-anchor="middle">ros2 topic pub</text>
<text x="110.0" y="114.0" text-anchor="middle">ペダルを踏む</text>
<text x="110.0" y="132.0" text-anchor="middle">（5-2でPI制御に）</text>
<text x="440.0" y="96.0" text-anchor="middle">vehicle_plant</text>
<text x="440.0" y="114.0" text-anchor="middle">VehicleModel</text>
<text x="440.0" y="132.0" text-anchor="middle">（数理モデル）</text>
<text x="770.0" y="105.0" text-anchor="middle">gz_display</text>
<text x="770.0" y="123.0" text-anchor="middle">速度 × 0.025</text>
<text x="770.0" y="280.0" text-anchor="middle">parameter_bridge</text>
<text x="770.0" y="298.0" text-anchor="middle">（ros_gz_bridge）</text>
<text x="440.0" y="271.0" text-anchor="middle">gz sim</text>
<text x="440.0" y="289.0" text-anchor="middle">vehicle_green</text>
<text x="440.0" y="307.0" text-anchor="middle">（DiffDrive）</text>
<text x="275.0" y="86.0" text-anchor="middle" font-size="12">/plant/pedal</text>
<text x="275.0" y="101.0" text-anchor="middle" font-size="12">Float64</text>
<text x="605.0" y="86.0" text-anchor="middle" font-size="12">/plant/velocity</text>
<text x="605.0" y="101.0" text-anchor="middle" font-size="12">Float64</text>
<text x="762" y="182.5" text-anchor="end" font-size="12">/model/vehicle_green/cmd_vel</text>
<text x="762" y="197.5" text-anchor="end" font-size="12">Twist（縮尺をかけた速度）</text>
<text x="605.0" y="276.0" text-anchor="middle" font-size="12">gz.msgs.Twist</text>
