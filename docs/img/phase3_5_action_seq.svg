<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 765 449" width="765" height="449" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="図: goal送信、受理、feedbackの繰り返し、resultの流れ。途中でcancelするとCANCELEDになる">
<title>図: goal送信、受理、feedbackの繰り返し、resultの流れ。途中でcancelするとCANCELEDになる</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="abs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="765" height="449" fill="#ffffff"/>
<g transform="translate(-42.6,12.0)" fill="#1a1a1a">
<rect x="90" y="198" width="670" height="66" fill="none" stroke="#777"/>
<rect x="90" y="198" width="50.7" height="20" fill="#e6e6e6" stroke="#777"/>
<text x="98" y="213" font-weight="bold">loop</text>
<text x="148.7" y="213" fill="#333">[1秒ごとに]</text>
<line x1="700" y1="58" x2="700" y2="413.0" stroke="#aaa" stroke-dasharray="5 4"/>
<line x1="150" y1="58" x2="150" y2="413.0" stroke="#aaa" stroke-dasharray="5 4"/>
<path d="M150.0,120.0 L700.0,120.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M700.0,164.0 L150.0,164.0" fill="none" stroke="#333333" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<path d="M700.0,242.0 L150.0,242.0" fill="none" stroke="#333333" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<path d="M700.0,308.0 L150.0,308.0" fill="none" stroke="#333333" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
