<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 200" width="1060" height="200" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="車両の題材（7-3〜7-5。観測5・行動1、PI制御とNNを比べ、Gazebo・ROS2のノードで動かした）から、このページで二足を小さく試し（Walker2d、MuJoCo、観測17・行動6、作成に使ったPCのCPUで）、性能の高いPCのGPUで数千の環境を並べて大量に学習し（Isaac Lab・MuJoCo Playground、rsl_rl・skrl）、ROS2でロボットへつなぐ（URDF・tf2・ros2_control、Gazebo・実機）、という流れ">
<title>車両の題材（7-3〜7-5。観測5・行動1、PI制御とNNを比べ、Gazebo・ROS2のノードで動かした）から、このページで二足を小さく試し（Walker2d、MuJoCo、観測17・行動6、作成に使ったPCのCPUで）、性能の高いPCのGPUで数千の環境を並べて大量に学習し（Isaac Lab・MuJoCo Playground、rsl_rl・skrl）、ROS2でロボットへつなぐ（URDF・tf2・ros2_control、Gazebo・実機）、という流れ</title>
