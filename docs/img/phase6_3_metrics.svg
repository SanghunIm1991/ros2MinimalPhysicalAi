<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="図: 記録を一時停止の状態で再生し始め、解析のノードがつながってから再生を進める。解析のノードは指標の計算を metrics.py に任せ、再生が終わったら表を出す">
<title>図: 記録を一時停止の状態で再生し始め、解析のノードがつながってから再生を進める。解析のノードは指標の計算を metrics.py に任せ、再生が終わったら表を出す</title>
