<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" width="1060" height="440" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="図: 記録用のlaunch（record.launch.py）が、7-5のlaunch（gazebo_nn.launch.py）と ros2 bag record を起動する。target_generator が目標速度を送り、制御器（引数 controller で nn_controller か pi_controller を選ぶ）がペダルを gz_plant へ送る。gz_plant はトルクをブリッジ経由で現実の時間で動くGazebo（減衰入りの vehicle_rl.sdf）へ送り、オドメトリから速度を返す。nn_controller は7-4の重み（.npz）を numpy だけで読む。記録は後で再生し、metrics ノードで6-3の指標を出す">
<title>図: 記録用のlaunch（record.launch.py）が、7-5のlaunch（gazebo_nn.launch.py）と ros2 bag record を起動する。target_generator が目標速度を送り、制御器（引数 controller で nn_controller か pi_controller を選ぶ）がペダルを gz_plant へ送る。gz_plant はトルクをブリッジ経由で現実の時間で動くGazebo（減衰入りの vehicle_rl.sdf）へ送り、オドメトリから速度を返す。nn_controller は7-4の重み（.npz）を numpy だけで読む。記録は後で再生し、metrics ノードで6-3の指標を出す</title>
