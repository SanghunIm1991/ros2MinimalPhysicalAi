<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1152" viewBox="0 0 1600 1152" role="img" aria-label="ROS2の最低限の構成でフィジカルAIの技術スタックを学ぶ教材の全体像。ゴールは、目標速度ノード・PI制御ノード・車両（自作の疑似プラントまたはGazeboの物理）が目標速度・ペダル・速度のトピックでつながる閉じたループで、慣性のある車両を目標の速度に追従させるシミュレーション。その下に4つの段階（必須のSTEP 1 基礎 フェーズ0〜4、STEP 2 制御 フェーズ5、STEP 3 評価 フェーズ6と、発展のSTEP 4 AI フェーズ7）を並べ、制御から「ゴールに到達」、評価から「記録して判定」の矢印がゴールへ伸びる。土台は、実行環境（Windows 11 + WSL2 + Ubuntu 24.04 + ROS 2 Jazzy + Gazebo）、強化学習（Stable-Baselines3、別の仮想環境）、マシン（専用のGPUは不要）、言語（Python と C++）の4項目。" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" fill="#1C2430">
<title>ROS2の最低限の構成でフィジカルAIの技術スタックを学ぶ教材の全体像。ゴールは、目標速度ノード・PI制御ノード・車両（自作の疑似プラントまたはGazeboの物理）が目標速度・ペダル・速度のトピックでつながる閉じたループで、慣性のある車両を目標の速度に追従させるシミュレーション。その下に4つの段階（必須のSTEP 1 基礎 フェーズ0〜4、STEP 2 制御 フェーズ5、STEP 3 評価 フェーズ6と、発展のSTEP 4 AI フェーズ7）を並べ、制御から「ゴールに到達」、評価から「記録して判定」の矢印がゴールへ伸びる。土台は、実行環境（Windows 11 + WSL2 + Ubuntu 24.04 + ROS 2 Jazzy + Gazebo）、強化学習（Stable-Baselines3、別の仮想環境）、マシン（専用のGPUは不要）、言語（Python と C++）の4項目。</title>
