<title>図: ROS2の最低限の構成で、フィジカルAIの技術スタックを一通り学ぶ教材の全体像。ゴールは慣性のある車両を目標の速度に追従させるシミュレーション（目標速度のノード→PI制御のノード→ペダル→車両→速度をPI制御へ戻す閉じたループ）。道のりは基礎（フェーズ0〜4）・制御（フェーズ5）・評価（フェーズ6）の必須の3段階と、AI（フェーズ7、発展）の4段階で、制御の段階でゴールに到達し、評価の段階でゴールを記録して判定する。土台は、実行環境がWindows 11・WSL2・Ubuntu 24.04・ROS 2 Jazzy・Gazebo、強化学習がStable-Baselines3（別の仮想環境）、専用のGPUは不要、言語はPythonとC++</title>
