<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="図: エージェント（方策）が0.1秒ごとにペダルを選び、車両の環境の中では、10秒ごとにランダムな幅で変わる目標速度のシナリオと、ブレーキの遅いプラント（5-1）が0.01秒ごとに進む。環境は観測5つと報酬を返し、残した記録は6-3の指標の計算に渡せる。7-3では、同じ形の環境をGazeboの物理で作る">
<title>図: エージェント（方策）が0.1秒ごとにペダルを選び、車両の環境の中では、10秒ごとにランダムな幅で変わる目標速度のシナリオと、ブレーキの遅いプラント（5-1）が0.01秒ごとに進む。環境は観測5つと報酬を返し、残した記録は6-3の指標の計算に渡せる。7-3では、同じ形の環境をGazeboの物理で作る</title>
