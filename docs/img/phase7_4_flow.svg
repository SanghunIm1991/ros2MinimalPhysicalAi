<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" width="1060" height="440" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="3節の学習のスクリプト（SAC）が、7-3の環境（Gazebo）にペダルを渡し、観測と報酬を受け取って学習する。学習したものは、SB3の.zip（学習の続き用。配らない）と、方策の重みだけの.npzに保存する。待てない場合は、4節で作成時の.npzを置く。.npzはnumpyだけで計算する方策（NpzPolicy）で読み込み、5節の比較のスクリプトで、同じ環境でPI制御と比べる。7-5のROS2のノードでも同じ方策を使う">
<title>3節の学習のスクリプト（SAC）が、7-3の環境（Gazebo）にペダルを渡し、観測と報酬を受け取って学習する。学習したものは、SB3の.zip（学習の続き用。配らない）と、方策の重みだけの.npzに保存する。待てない場合は、4節で作成時の.npzを置く。.npzはnumpyだけで計算する方策（NpzPolicy）で読み込み、5節の比較のスクリプトで、同じ環境でPI制御と比べる。7-5のROS2のノードでも同じ方策を使う</title>
