<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="図: インターフェースのパッケージに書いた定義ファイル（.msg・.srv・.action）から、colcon build の rosidl_generate_interfaces がPythonとC++のコードを生成し、ノードはそれを import・#include して使う">
<title>図: インターフェースのパッケージに書いた定義ファイル（.msg・.srv・.action）から、colcon build の rosidl_generate_interfaces がPythonとC++のコードを生成し、ノードはそれを import・#include して使う</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="880" height="300" fill="#ffffff"/>
<g fill="#1a1a1a">
<rect x="460" y="100" width="230" height="270" rx="10" fill="#f6fbf4" stroke="#9cc49a" stroke-dasharray="6 4"/>
<rect x="20" y="30" width="300" height="250" rx="10" fill="#f6fbf4" stroke="#9cc49a" stroke-dasharray="6 4"/>
<path d="M300,155 L340,155" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M590,135 L615,135 L615,85 L640,85" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M590,175 L615,175 L615,225 L640,225" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="80" width="260" height="150" rx="8" fill="#fff7e6" stroke="#c9a24a"/>
<rect x="340" y="110" width="250" height="90" rx="8" fill="#fff4ec" stroke="#c47a3a"/>
<rect x="640" y="40" width="220" height="90" rx="8" fill="#eef3fb" stroke="#5b7db8"/>
<rect x="640" y="180" width="220" height="90" rx="8" fill="#eef3fb" stroke="#5b7db8"/>
<text x="476" y="124" font-weight="bold">解析のノード</text>
<text x="36" y="54" font-weight="bold">インターフェースのパッケージ</text>
<text x="170.0" y="130.0" text-anchor="middle">msg/VehicleState.msg</text>
<text x="170.0" y="150.0" text-anchor="middle">srv/SetGains.srv</text>
<text x="170.0" y="170.0" text-anchor="middle">action/DriveDistance.action</text>
<text x="170.0" y="190.0" text-anchor="middle">（ament_cmake で作る）</text>
<text x="465.0" y="140.0" text-anchor="middle">colcon build</text>
<text x="465.0" y="160.0" text-anchor="middle">rosidl_generate_interfaces</text>
<text x="465.0" y="180.0" text-anchor="middle">（コードを生成）</text>
<text x="750.0" y="70.0" text-anchor="middle">Pythonのクラス</text>
<text x="750.0" y="90.0" text-anchor="middle">learn_interfaces.msg</text>
<text x="750.0" y="110.0" text-anchor="middle">（import して使う）</text>
<text x="750.0" y="210.0" text-anchor="middle">C++のクラス（構造体）</text>
<text x="750.0" y="230.0" text-anchor="middle">learn_interfaces::msg</text>
<text x="750.0" y="250.0" text-anchor="middle">（#include して使う）</text>
<text x="750" y="155" text-anchor="middle" font-size="13">同じ定義から作るので</text>
<text x="750" y="172" text-anchor="middle" font-size="13">言語が違ってもつながる</text>
</g>
</svg>
