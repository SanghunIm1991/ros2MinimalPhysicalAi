<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="図: 記録用のlaunchが5-3か5-4の一式とros2 bag recordを起動し、target_generatorが終わると全体が止まる。2つの記録を、片方のトピック名を付け替えて同時に再生し、rqt_plotに重ねる">
<title>図: 記録用のlaunchが5-3か5-4の一式とros2 bag recordを起動し、target_generatorが終わると全体が止まる。2つの記録を、片方のトピック名を付け替えて同時に再生し、rqt_plotに重ねる</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
<g fill="#1a1a1a">
<rect x="10" y="10" width="880" height="200" rx="10" fill="#fbfbfd" stroke="#9aa3b2" stroke-dasharray="6 4"/>
<rect x="10" y="235" width="500" height="235" rx="10" fill="#f6fbf4" stroke="#9cc49a" stroke-dasharray="6 4"/>
<path d="M370,95 L600,95" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M200,130 L200,175 L585,175 L585,115 L600,115" fill="none" stroke="#333333" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<path d="M622,130 L622,250" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M802,130 L802,250" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M540,275 L525,275 L525,310 L500,310" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M802,300 L802,410 L500,410" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M300,310 L240,310 L240,350 L225,350" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M300,410 L240,410 L240,370 L225,370" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="60" width="340" height="70" rx="8" fill="#eef3fb" stroke="#5b7db8"/>
<rect x="600" y="60" width="220" height="70" rx="8" fill="#eef3fb" stroke="#5b7db8"/>
<rect x="540" y="250" width="165" height="50" rx="16" fill="#fff7e6" stroke="#c9a24a"/>
<rect x="720" y="250" width="165" height="50" rx="16" fill="#fff7e6" stroke="#c9a24a"/>
<rect x="300" y="280" width="200" height="60" rx="8" fill="#eef3fb" stroke="#5b7db8"/>
<rect x="300" y="380" width="200" height="60" rx="8" fill="#eef3fb" stroke="#5b7db8"/>
<rect x="20" y="320" width="205" height="80" rx="8" fill="#eef3fb" stroke="#5b7db8"/>
<text x="26" y="34" font-weight="bold">記録する（4節・5節）: record.launch.py</text>
<text x="26" y="259" font-weight="bold">重ねて見る（6節）</text>
<text x="200.0" y="90.0" text-anchor="middle">5-3 または 5-4 の一式</text>
<text x="200.0" y="110.0" text-anchor="middle">target_generator は end_time 秒で終わる</text>
<text x="710.0" y="90.0" text-anchor="middle">ros2 bag record</text>
<text x="710.0" y="110.0" text-anchor="middle">3つのトピックを記録</text>
<text x="622.5" y="280.0" text-anchor="middle">bags/sim_default</text>
<text x="802.5" y="280.0" text-anchor="middle">bags/gz_default</text>
<text x="400.0" y="305.0" text-anchor="middle">ros2 bag play</text>
<text x="400.0" y="325.0" text-anchor="middle">（そのまま）</text>
<text x="400.0" y="405.0" text-anchor="middle">ros2 bag play</text>
<text x="400.0" y="425.0" text-anchor="middle">（/gz/... に付け替え）</text>
<text x="122.5" y="345.0" text-anchor="middle">rqt_plot</text>
<text x="122.5" y="365.0" text-anchor="middle">/plant/... と</text>
<text x="122.5" y="385.0" text-anchor="middle">/gz/plant/... を重ねる</text>
<text x="485" y="86" text-anchor="middle" font-size="13">/target_velocity など3つ</text>
<text x="392" y="165" text-anchor="middle" font-size="13">target_generator が終わると、Shutdown で全体が止まる</text>
</g>
</svg>
