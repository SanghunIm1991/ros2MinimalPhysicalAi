<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" width="1180" height="680" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="この教材の最終ゴール（フェーズ7-5）の一式。launchファイルで起動した一式の中で、target_generator（フェーズ5-3）が目標速度を、nn_controller（フェーズ7-5）が学習したNNでペダルを決め、gz_plant（フェーズ5-1・5-4）がペダルを車輪の力に直して、Gazeboとブリッジ（フェーズ5-0・5-4）が車両の物理を計算し、オドメトリから速度を返す。nn_controller は、引数でPI制御の pi_controller（フェーズ5-2）と入れ替えられる。NNの重み（.npz、フェーズ7-4）は、ROS2の外で強化学習（Gymnasium・SB3、フェーズ7-0〜7-4）で学習させる。一式のトピックは ros2 bag record（フェーズ6-1）で記録し、再生して metrics（フェーズ6-3）で指標を計算して、PI制御とNNを比べる">
<title>この教材の最終ゴール（フェーズ7-5）の一式。launchファイルで起動した一式の中で、target_generator（フェーズ5-3）が目標速度を、nn_controller（フェーズ7-5）が学習したNNでペダルを決め、gz_plant（フェーズ5-1・5-4）がペダルを車輪の力に直して、Gazeboとブリッジ（フェーズ5-0・5-4）が車両の物理を計算し、オドメトリから速度を返す。nn_controller は、引数でPI制御の pi_controller（フェーズ5-2）と入れ替えられる。NNの重み（.npz、フェーズ7-4）は、ROS2の外で強化学習（Gymnasium・SB3、フェーズ7-0〜7-4）で学習させる。一式のトピックは ros2 bag record（フェーズ6-1）で記録し、再生して metrics（フェーズ6-3）で指標を計算して、PI制御とNNを比べる</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
