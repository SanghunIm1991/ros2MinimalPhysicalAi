<text x="440" y="290" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ7-5</text>
<text x="740" y="226" text-anchor="middle" font-weight="bold">gz_plant</text>
<text x="740" y="246" text-anchor="middle">ペダルを</text>
<text x="740" y="266" text-anchor="middle">車輪の力に直す</text>
<text x="740" y="290" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ5-1・5-4</text>
<text x="1040" y="226" text-anchor="middle" font-weight="bold">Gazebo＋ブリッジ</text>
<text x="1040" y="246" text-anchor="middle">車両の物理を</text>
<text x="1040" y="266" text-anchor="middle">計算する</text>
<text x="1040" y="290" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ5-0・5-4</text>
<text x="440" y="376" text-anchor="middle" font-weight="bold">pi_controller</text>
<text x="440" y="396" text-anchor="middle">PI制御。引数で</text>
<text x="440" y="416" text-anchor="middle">NNと入れ替える</text>
<text x="440" y="440" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ5-2</text>
<text x="740" y="566" text-anchor="middle" font-weight="bold">ros2 bag record</text>
<text x="740" y="586" text-anchor="middle">トピックを</text>
<text x="740" y="606" text-anchor="middle">ファイルに記録</text>
<text x="740" y="630" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ6-1</text>
<text x="1040" y="566" text-anchor="middle" font-weight="bold">metrics</text>
