<rect x="340" y="350" width="200" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="640" y="540" width="200" height="110" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
