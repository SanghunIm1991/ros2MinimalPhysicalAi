<text x="40" y="184" font-weight="bold">launchファイルで一式を起動（フェーズ4・5-3・7-5）</text>
<text x="140" y="46" text-anchor="middle" font-weight="bold">強化学習で学習</text>
<text x="140" y="66" text-anchor="middle">Gymnasium・SB3</text>
<text x="140" y="86" text-anchor="middle">（ROS2の外）</text>
<text x="140" y="110" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ7-0〜7-4</text>
<text x="440" y="46" text-anchor="middle" font-weight="bold">学習済みの重み</text>
<text x="440" y="66" text-anchor="middle">（.npz）</text>
<text x="440" y="86" text-anchor="middle">numpyだけで読む</text>
<text x="440" y="110" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ7-4</text>
