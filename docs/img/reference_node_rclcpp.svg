<path d="M220,671.0 L370,671.0 L370,588" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<path d="M20,740 L70,740" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#tri)"/>
