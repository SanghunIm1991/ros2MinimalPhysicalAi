<text x="338" y="59" font-size="12">+ Talker() / Talker(NodeOptions)（間章）</text>
<text x="338" y="77" font-size="12">- pub_ / timer_ / sub_: SharedPtr</text>
<rect x="720" y="16" width="300" height="54" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
