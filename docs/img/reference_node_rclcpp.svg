<line x1="900" y1="561" x2="1090" y2="561" stroke="#3b6fb6" stroke-width="1"/>
<text x="908" y="577" font-size="12">+ publish(msg)</text>
<rect x="20" y="644" width="200" height="54" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="120.0" y="664" text-anchor="middle" font-weight="bold" font-size="13">CallbackGroup</text>
<line x1="20" y1="671" x2="220" y2="671" stroke="#777777" stroke-width="1"/>
<text x="28" y="687" font-size="12">WeakPtr のリストで覚える</text>
<text x="805" y="252" text-anchor="middle" font-size="11" fill="#444444">11個を保持</text>
<text x="805" y="282" text-anchor="middle" font-size="11" fill="#444444">処理を任せる</text>
<text x="260" y="188" text-anchor="middle" font-size="11" fill="#444444">渡す</text>
<text x="260" y="293" text-anchor="middle" font-size="11" fill="#444444">所属</text>
<text x="260" y="383" text-anchor="middle" font-size="11" fill="#444444">登録</text>
<text x="260" y="409" text-anchor="middle" font-size="11" fill="#444444">して回す</text>
<text x="540" y="474" text-anchor="start" font-size="11" fill="#444444">作って SharedPtr で返す（持ち続けるのは呼び出し側）</text>
<text x="380" y="663.0" text-anchor="start" font-size="11" fill="#444444">弱い参照（WeakPtr）で覚える（Subscription・Timer・Service・Client）</text>
<text x="78" y="744" text-anchor="start" font-size="11" fill="#444444">継承（矢印の先が親クラス）</text>
<text x="358" y="744" text-anchor="start" font-size="11" fill="#444444">保持（ひし形の側が持ち主）</text>
<text x="638" y="744" text-anchor="start" font-size="11" fill="#444444">使う・登録する・作って返す</text>
