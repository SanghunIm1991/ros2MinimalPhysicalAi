<path d="M120,480 L120,432" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#tri)"/>
<path d="M530,444 L530,489" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4"/>
<path d="M370,489 L995,489" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4"/>
<path d="M370.0,489 L370.0,534" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/>
