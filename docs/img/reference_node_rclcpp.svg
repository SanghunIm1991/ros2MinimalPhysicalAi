<text x="28" y="203" font-size="12">remap・パラメータ・</text>
<text x="28" y="221" font-size="12">プロセス内通信などの設定</text>
<rect x="20" y="270" width="200" height="54" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="120.0" y="290" text-anchor="middle" font-weight="bold" font-size="13">Context</text>
<line x1="20" y1="297" x2="220" y2="297" stroke="#777777" stroke-width="1"/>
<text x="28" y="313" font-size="12">rclcpp::init() で作られる</text>
<rect x="20" y="360" width="200" height="72" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="120.0" y="380" text-anchor="middle" font-weight="bold" font-size="13">Executor</text>
<line x1="20" y1="387" x2="220" y2="387" stroke="#3b6fb6" stroke-width="1"/>
<text x="28" y="403" font-size="12">+ add_node(ノードの部品)</text>
