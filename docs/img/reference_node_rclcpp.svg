<text x="308" y="211" font-size="12">   11個: node_interfaces::〜Interface::SharedPtr</text>
<text x="308" y="229" font-size="12">- node_options_: NodeOptions</text>
<line x1="300" y1="237" x2="760" y2="237" stroke="#3b6fb6" stroke-width="1"/>
<text x="308" y="253" font-size="12">+ Node(名前, NodeOptions)</text>
