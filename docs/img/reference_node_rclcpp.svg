<text x="308" y="289" font-size="12">+ create_subscription&lt;型&gt;(名前, qos, コールバック)</text>
<text x="308" y="307" font-size="12">+ create_wall_timer(周期, コールバック)</text>
<text x="308" y="325" font-size="12">+ create_service&lt;型&gt;(名前, コールバック)</text>
<text x="308" y="343" font-size="12">+ create_client&lt;型&gt;(名前)</text>
<text x="308" y="361" font-size="12">+ declare_parameter&lt;型&gt;(名前, 既定値)</text>
<text x="308" y="379" font-size="12">+ get_parameter(名前)</text>
