<text x="858" y="247" font-size="12">NodeServicesInterface</text>
<text x="858" y="265" font-size="12">NodeParametersInterface</text>
<text x="858" y="283" font-size="12">NodeClockInterface</text>
<text x="858" y="301" font-size="12">NodeLoggingInterface</text>
<text x="858" y="319" font-size="12">NodeGraphInterface</text>
<text x="858" y="337" font-size="12">NodeTimeSourceInterface</text>
<text x="858" y="355" font-size="12">NodeWaitablesInterface</text>
<text x="858" y="373" font-size="12">NodeTypeDescriptionsInterface</text>
<rect x="20" y="160" width="200" height="72" rx="4" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
