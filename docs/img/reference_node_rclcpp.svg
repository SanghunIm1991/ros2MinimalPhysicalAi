<text x="458" y="577" font-size="12">（コールバック）</text>
<rect x="600" y="534" width="140" height="54" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="670.0" y="554" text-anchor="middle" font-weight="bold" font-size="13">Service&lt;型&gt;</text>
<line x1="600" y1="561" x2="740" y2="561" stroke="#3b6fb6" stroke-width="1"/>
<text x="608" y="577" font-size="12">（コールバック）</text>
<rect x="750" y="534" width="140" height="54" rx="4" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="820.0" y="554" text-anchor="middle" font-weight="bold" font-size="13">Client&lt;型&gt;</text>
<line x1="750" y1="561" x2="890" y2="561" stroke="#3b6fb6" stroke-width="1"/>
<text x="758" y="577" font-size="12">（コールバック）</text>
